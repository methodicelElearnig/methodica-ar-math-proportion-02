<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חדר בריחה - תיבת העץ האבודה</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-wrapper {
            display: flex;
            background-color: #34495e;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            width: 1180px; /* הגדלנו את המעטפת הכללית כדי לתמוך באלמנטים הגדולים */
            gap: 50px;
            perspective: 1200px;
        }

        .chest-scene-container {
            flex: 1.8;
            text-align: center;
        }

        h1 {
            color: #ecf0f1;
            margin-bottom: 35px;
            font-size: 30px; /* הגדלנו את הכותרת הראשית */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            text-align: center;
        }

        /* --- עיצוב תיבת העץ (מוגדלת עוד יותר) --- */
        .chest-scene {
            position: relative;
            width: 500px; /* הגדלנו מ-440px */
            height: 340px; /* הגדלנו מ-300px */
            margin: 0 auto 45px;
        }

        .wooden-chest {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        /* מכסה התיבה */
        .chest-lid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 130px; /* הגדלנו מ-115px */
            background: linear-gradient(to bottom, #8b4513, #a0522d);
            border: 5px solid #5c2d16;
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            box-sizing: border-box;
            transform-origin: top;
            transition: transform 1s ease-in-out;
            z-index: 3;
            box-shadow: inset 0 10px 20px rgba(255,255,255,0.1);
        }

        /* פינות זהב למכסה */
        .chest-lid::before, .chest-lid::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 30px;
            height: 30px;
            background-color: #d4af37;
            border: 2px solid #aa8010;
        }
        .chest-lid::before { left: 0; border-radius: 15px 0 0 0; }
        .chest-lid::after { right: 0; border-radius: 0 15px 0 0; }

        /* בסיס התיבה */
        .chest-base {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 210px; /* הגדלנו מ-185px */
            background: linear-gradient(to bottom, #a0522d, #5c2d16);
            border: 5px solid #5c2d16;
            border-radius: 0 0 10px 10px;
            box-sizing: border-box;
            z-index: 1;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        /* פינות זהב לבסיס */
        .chest-base::before, .chest-base::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 35px;
            height: 45px;
            background-color: #d4af37;
            border: 2px solid #aa8010;
        }
        .chest-base::before { left: 0; border-radius: 0 0 0 10px; }
        .chest-base::after { right: 0; border-radius: 0 0 10px 0; }

        /* פנים התיבה */
        .chest-inside {
            position: absolute;
            top: 130px;
            left: 5px;
            width: 490px;
            height: 205px;
            background: radial-gradient(circle, #f39c12, #2c3e50 80%);
            border-radius: 0 0 10px 10px;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 65px; /* אמוג'י גדול יותר */
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px #f1c40f;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* --- עיצוב המנעול התלוי (מוגדל עוד יותר) --- */
        .padlock {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 350px; /* הגדלנו מ-300px */
            height: 240px; /* הגדלנו מ-210px */
            z-index: 5;
            transition: all 0.8s ease;
        }

        /* קשת המנעול */
        .shackle {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 170px; /* הגדלנו מ-140px */
            height: 95px; /* הגדלנו מ-80px */
            border: 16px solid #7f8c8d; /* קשת עבה וגדולה יותר */
            border-bottom: none;
            border-radius: 85px 85px 0 0;
            box-sizing: border-box;
            transition: transform 0.4s ease;
            z-index: 4;
        }

        /* גוף המנעול */
        .lock-body {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 225px; /* הגדלנו מ-195px */
            background: linear-gradient(135deg, #f1c40f, #d4af37, #f39c12);
            border: 5px solid #aa8010;
            border-radius: 18px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px; /* מרווח פנימי גדול ומייצב */
            box-sizing: border-box;
        }

        /* עיצוב התוויות מעל הספרות במנעול */
        .lock-labels-container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            direction: ltr;
        }
        .label-text {
            color: #333;
            font-size: 17px; /* הגדלנו מ-15px לקריאות מעולה */
            font-weight: bold;
            width: 145px; /* התאמת רוחב לכיתוב הגדול */
            text-align: center;
            line-height: 1.2;
        }

        /* ממשק הספרות בתוך המנעול */
        .lock-interface {
            display: flex;
            gap: 18px; /* רווח גדול יותר בין הטורים */
            direction: ltr;
        }

        .digit-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 55px; /* הרחבנו מ-50px */
        }

        .calc-btn {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 5px;
            width: 100%;
            height: 32px; /* הגדלנו מ-28px */
            font-size: 22px; /* פלוס ומינוס גדולים וברורים */
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calc-btn:hover { background-color: #555; }

        .number-box {
            font-size: 40px; /* הגדלנו מ-34px - ספרות ענקיות וברורות */
            font-weight: bold;
            background-color: #111;
            color: #f1c40f;
            width: 100%;
            height: 65px; /* הגדלנו מ-55px */
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            margin: 5px 0;
            border: 2px solid #555;
        }

        /* --- פאנל צידי לפרופורציות (בצד שמאל - מוגדל) --- */
        .side-panel {
            flex: 1.4; /* נותן עוד נפח לפאנל השמאלי */
            background-color: #4a6781;
            padding: 30px; /* הגדלנו את הריפוד הפנימי */
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* הגדלת הכיתוב מעל הפרופורציות בצד שמאל */
        .side-panel h3 {
            color: #fff;
            margin-bottom: 30px;
            font-size: 22px; /* הגדלנו מ-18px לבקשתך */
            line-height: 1.5;
            font-weight: 600;
        }

        /* הגדלת משוואות הפרופורציה והשברים */
        .proportion-equation {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f1c40f;
            font-size: 34px; /* הגדלנו את סימני השוויון והמספרים מ-28px */
            margin-bottom: 35px;
        }

        .fraction {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .fraction-line {
            width: 85px; /* קו שבר רחב יותר */
            height: 4px; /* עבה יותר */
            background-color: #f1c40f;
            margin: 6px 0;
        }

        .numerator, .denominator {
            font-weight: bold;
        }

        .input-fraction {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 20px;
        }

        /* תיבות הקלט החדשות והמוגדלות בצד שמאל */
        .proportion-input {
            width: 100px; /* הגדלנו מ-80px שיהיה המון מקום לאותיות וסימנים */
            height: 45px;  /* הגדלנו מ-35px */
            font-size: 22px; /* גופן גדול וקריא בפנים מ-18px */
            font-weight: bold;
            background-color: #111;
            color: #f1c40f;
            text-align: center;
            border: 3px solid #fff; /* מסגרת בולטת יותר */
            border-radius: 6px;
            box-sizing: border-box;
            direction: ltr;
        }

        .input-fraction-line {
            width: 110px; /* מותאם לרוחב התיבות החדש */
            height: 4px;
            background-color: #fff;
            margin: 8px 0;
        }

        .equals {
            font-size: 34px;
            font-weight: bold;
            color: #f1c40f;
            margin-right: 20px;
        }

        /* --- מצבי פתיחה --- */
        .scene-opened .chest-lid {
            transform: rotateX(-115deg);
        }

        .scene-opened .chest-inside {
            opacity: 1;
        }

        .scene-opened .shackle {
            transform: translate(-50%, -25px);
        }

        .scene-opened .padlock {
            opacity: 0;
            transform: translate(-50%, 90px) scale(0.8);
            pointer-events: none;
            transition-delay: 0.4s;
        }

        /* כפתור בדיקה מוגדל */
        .unlock-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 18px; /* הגדלנו מ-15px */
            font-size: 22px; /* הגדלנו מ-20px */
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .unlock-btn:hover { background-color: #27ae60; }

        .feedback {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
            min-height: 35px;
            color: #fff;
        }
        .win { color: #2ecc71; text-shadow: 0 0 10px #2ecc71; }
        .lose { color: #e74c3c; }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="chest-scene-container">
        <h1>🔑 חדר בריחה: פצחו את מנעול התיבה</h1>
        
        <div id="scene" class="chest-scene">
            <div class="wooden-chest">
                <div class="chest-lid"></div>
                <div class="chest-inside">✨ 🔓 ✨</div>
                <div class="chest-base"></div>
            </div>

            <div class="padlock">
                <div class="shackle"></div>
                <div class="lock-body">
                    <div class="lock-labels-container">
                        <div class="label-text">הגיל של אבא היום</div>
                        <div class="label-text">הגיל של אמא היום</div>
                    </div>
                    <div class="lock-interface">
                        <div class="digit-column">
                            <button class="calc-btn" onclick="stepUp(0)">+</button>
                            <div id="num0" class="number-box">0</div>
                            <button class="calc-btn" onclick="stepDown(0)">-</button>
                        </div>
                        <div class="digit-column">
                            <button class="calc-btn" onclick="stepUp(1)">+</button>
                            <div id="num1" class="number-box">0</div>
                            <button class="calc-btn" onclick="stepDown(1)">-</button>
                        </div>
                        <div class="digit-column">
                            <button class="calc-btn" onclick="stepUp(2)">+</button>
                            <div id="num2" class="number-box">0</div>
                            <button class="calc-btn" onclick="stepDown(2)">-</button>
                        </div>
                        <div class="digit-column">
                            <button class="calc-btn" onclick="stepUp(3)">+</button>
                            <div id="num3" class="number-box">0</div>
                            <button class="calc-btn" onclick="stepDown(3)">-</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button class="unlock-btn" onclick="validateLock()">לחצו לפתיחת המנעול</button>
        <div id="feedbackText" class="feedback"></div>
    </div>

    <div class="side-panel">
        <h3>השלימו את הפרופורציות הבאות והיעזרו בהן למציאת הקוד של המנעול</h3>
        
        <div class="proportion-equation">
            <div class="input-fraction">
                <input class="proportion-input" type="text">
                <div class="input-fraction-line"></div>
                <input class="proportion-input" type="text">
            </div>
            <div class="equals">=</div>
            <div class="fraction">
                <div class="numerator">4</div>
                <div class="fraction-line"></div>
                <div class="denominator">11</div>
            </div>
        </div>

        <div class="proportion-equation">
            <div class="input-fraction">
                <input class="proportion-input" type="text">
                <div class="input-fraction-line"></div>
                <input class="proportion-input" type="text">
            </div>
            <div class="equals">=</div>
            <div class="fraction">
                <div class="numerator">2</div>
                <div class="fraction-line"></div>
                <div class="denominator">7</div>
            </div>
        </div>
    </div>
</div>

<script>
    let digits = [0, 0, 0, 0];
    const secretCode = [4, 2, 3, 9];

    function stepUp(index) {
        digits[index] = (digits[index] + 1) % 10;
        document.getElementById('num' + index).innerText = digits[index];
        document.getElementById('feedbackText').innerText = ''; 
    }

    function stepDown(index) {
        digits[index] = (digits[index] - 1 + 10) % 10;
        document.getElementById('num' + index).innerText = digits[index];
        document.getElementById('feedbackText').innerText = ''; 
    }

    function validateLock() {
        const feedback = document.getElementById('feedbackText');
        const scene = document.getElementById('scene');
        
        let isMatch = true;
        for(let i = 0; i < 4; i++) {
            if(digits[i] !== secretCode[i]) {
                isMatch = false;
            }
        }

        if (isMatch) {
            feedback.innerText = "הקוד נכון! המנעול השתחרר והתיבה נפתחה! 🌟";
            feedback.className = "feedback win";
            scene.classList.add('scene-opened');
        } else {
            feedback.innerText = "המנעול נעול... הקוד לא נכון.";
            feedback.className = "feedback lose";
            
            const padlock = document.querySelector('.padlock');
            padlock.animate([
                { transform: 'translateX(-50%) rotate(0deg)' },
                { transform: 'translateX(-55%) rotate(-5deg)' },
                { transform: 'translateX(-45%) rotate(5deg)' },
                { transform: 'translateX(-50%) rotate(0deg)' }
            ], { duration: 250 });
        }
    }
</script>

</body>
</html>
