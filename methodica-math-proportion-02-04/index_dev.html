<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>DEV — פרופורציה</title>
  <!-- Ported from methodica-math-central-tendency-03-01/index_dev.html, which
       ported it from examples/methodica-math-ratio-01 — the canonical 720 DEV
       harness. Keep it that way: this bar is the producer's review tool, and it
       should look and behave identically in every unit.

       Adapted from multi-part to single-part: central-tendency-03 keys notes
       per PART because finishing a part navigates the iframe to the next one,
       so the wrapper's own id is not necessarily the part on screen. This unit
       has one part, so that dimension is dropped rather than carried dead —
       notes key straight off UNIT_ID and labels lose the part prefix. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: monospace; }

    #dev-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 44px;
      background: #f9ca24; color: #1a1a2e;
      display: flex; align-items: center; gap: 10px;
      padding: 0 12px; z-index: 9999; font-size: 13px; font-weight: 700;
      direction: ltr;
      transition: background 0.2s ease;
    }
    /* review status of the CURRENT screen colors the whole bar:
       green = approved, striped strong-yellow = needs fixing */
    #dev-bar.st-ok  { background: #2ecc71; }
    #dev-bar.st-fix {
      background: repeating-linear-gradient(45deg, #f9ca24 0 18px, #f39c12 18px 36px);
    }
    .st-btn {
      height: 28px; width: 34px; border: none; border-radius: 4px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    #st-ok    { background: #1e8f4e; color: #fff; }
    #st-fix   { background: #b06f00; color: #fff; }
    #st-clear { background: #1a1a2e; color: #f9ca24; }
    #st-badge {
      min-width: 74px; text-align: center;
      padding: 3px 10px; border-radius: 1000px;
      background: rgba(26, 26, 46, 0.85); color: #fff; font-size: 12px;
    }
    #dev-bar span { background: #1a1a2e; color: #f9ca24; padding: 2px 8px; border-radius: 4px; }
    #dev-bar button {
      height: 28px; padding: 0 12px; border: none; border-radius: 4px;
      background: #1a1a2e; color: #f9ca24; font-weight: 700; cursor: pointer; font-size: 13px;
    }
    #dev-bar button:hover { background: #333; }
    #dev-bar input[type=number] {
      width: 54px; height: 28px; border: none; border-radius: 4px;
      text-align: center; font-size: 14px; font-weight: 700;
    }
    #dev-bar select {
      height: 28px; max-width: 260px; border: none; border-radius: 4px;
      background: #1a1a2e; color: #f9ca24; font-weight: 700; font-size: 13px;
      padding: 0 8px; cursor: pointer; direction: rtl;
    }
    #dev-label { margin-left: 6px; }

    /* ── Mapped-but-unbuilt slots ──────────────────────────────────────
       A reserved index must never read as "screen doesn't exist" — that is
       how a gap ships unnoticed. The lomda redirects away from one and says
       so in the console; the bar says so visually. */
    #dev-bar.st-reserved { background: #e67e22; }
    #dev-label.reserved  { color: #ff8a3d; }

    /* ── Review notes drawer ───────────────────────────────────
       A proofing tool, not part of the deliverable. One note per screen,
       kept in localStorage under the unit id so a reviewer can walk the
       lomda screen by screen and leave corrections where they belong,
       then export the lot in one block. */
    #notes-btn { position: relative; }
    #notes-btn.has-notes::after {
      content: ''; position: absolute; top: 3px; left: 5px;
      width: 7px; height: 7px; border-radius: 50%; background: #e74c3c;
    }
    #notes-drawer {
      position: fixed; top: 44px; right: 0; bottom: 0; width: 380px;
      background: #1a1a2e; color: #f9ca24;
      border-left: 2px solid #f9ca24;
      display: none; flex-direction: column;
      z-index: 10000; font-family: 'Assistant', system-ui, sans-serif;
      direction: rtl;
    }
    #notes-drawer.open { display: flex; }
    #notes-head {
      padding: 12px 16px; border-bottom: 1px solid #333;
      display: flex; align-items: center; gap: 10px;
    }
    #notes-screen { font: 700 16px monospace; color: #f9ca24; }
    #notes-name { font-size: 13px; color: #aaa; flex: 1 1 auto;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #notes-close { background: none; border: none; color: #f9ca24;
      font-size: 20px; cursor: pointer; padding: 0 4px; }
    #notes-text {
      flex: 1 1 auto; margin: 12px 16px; padding: 12px;
      background: #12121f; color: #fff; border: 1px solid #333; border-radius: 8px;
      font-family: 'Assistant', system-ui, sans-serif; font-size: 15px;
      line-height: 1.5; resize: none; direction: rtl; text-align: right;
    }
    #notes-text:focus { outline: none; border-color: #f9ca24; }
    #notes-foot { padding: 0 16px 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #notes-foot button {
      height: 32px; padding: 0 14px; border: 1px solid #f9ca24; border-radius: 6px;
      background: transparent; color: #f9ca24; font-size: 14px; cursor: pointer;
      font-family: inherit;
    }
    #notes-foot button:hover { background: #f9ca24; color: #1a1a2e; }
    #notes-status { font-size: 12px; color: #6c6; margin-right: auto; }
    /* The summary reuses the drawer, so one panel serves both jobs. */
    #notes-summary {
      flex: 1 1 auto; margin: 12px 16px; padding: 12px; overflow: auto;
      background: #12121f; border: 1px solid #333; border-radius: 8px;
      font-family: 'Assistant', system-ui, sans-serif; font-size: 14px;
      color: #fff; white-space: pre-wrap; direction: rtl; text-align: right;
      display: none;
    }
    #notes-drawer.summary #notes-text, #notes-drawer.summary #notes-save { display: none; }
    #notes-drawer.summary #notes-summary { display: block; }
    /* Per-entry pruning. The summary accumulates items that stopped being
       true two fixes ago, so each entry gets its own ✕ rather than only an
       all-or-nothing wipe — "this one is done" is the common case and
       "throw the whole review away" is the rare one. */
    .nsum-item { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; }
    .nsum-item + .nsum-item { border-top: 1px solid #2a2a3a; padding-top: 10px; }
    .nsum-body { flex: 1 1 auto; white-space: pre-wrap; }
    .nsum-del {
      flex: 0 0 auto; width: 22px; height: 22px; line-height: 20px; padding: 0;
      border: 1px solid #555; border-radius: 5px; background: transparent;
      color: #999; font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .nsum-del:hover { border-color: #e06c6c; color: #e06c6c; }
    /* Destructive buttons read as destructive. */
    /* The general-notes toggle, lit while it is the bucket being edited. */
    #notes-foot button.is-on { background: #f9ca24; color: #1a1a2e; font-weight: 700; }
    #notes-foot button.is-danger { border-color: #e06c6c; color: #e06c6c; }
    #notes-foot button.is-danger:hover { background: #e06c6c; color: #1a1a2e; }
    /* Each of the two clear buttons belongs to exactly one of the drawer's
       two modes: you cannot delete "this screen's note" while looking at
       the summary, and "delete everything" has no meaning on one screen. */
    #notes-drawer.summary #notes-del { display: none; }
    #notes-drawer:not(.summary) #notes-clear { display: none; }

    #lomda-frame {
      position: fixed; top: 44px; left: 0; right: 0; bottom: 0;
      border: none; width: 100%; height: calc(100% - 44px);
    }
  </style>
</head>
<body>

<div id="dev-bar">
  <span>DEV</span>
  <button onclick="nav(+1)" title="קדימה (RTL: שמאל = קדימה)">◀</button>
  <span id="dev-label">S — / 60</span>
  <button onclick="nav(-1)" title="אחורה (RTL: ימין = אחורה)">▶</button>
  <input type="number" id="jump-input" min="0" value="0" onkeydown="if(event.key==='Enter')jumpTo()">
  <button onclick="jumpTo()">Go</button>
  <select id="screen-select" onchange="send(parseInt(this.value, 10))"></select>
  <!-- Step control. Two of this part's screens are multi-step (the 12-step
       carousel and the 7-step guided practice); without this a reviewer sees
       step 1 of 12 and signs off the screen. Hidden on single-step screens. -->
  <span id="step-group" hidden>
    <button class="st-btn" onclick="stepBy(-1)" title="שלב קודם">‹</button>
    <span id="step-label">1 / 1</span>
    <button class="st-btn" onclick="stepBy(1)" title="שלב הבא">›</button>
  </span>
  <span id="st-badge">—</span>
  <button class="st-btn" id="st-ok"    onclick="setStatus('ok')"    title="מאושר — עברתי ואישרתי">✓</button>
  <button class="st-btn" id="st-fix"   onclick="setStatus('fix')"   title="דורש תיקון">!</button>
  <button id="notes-btn" onclick="notesToggle()" title="תיקונים למסך הזה">📝</button>
  <!-- Walks the whole part by CLICKING, the way a learner does. The one
       failure this catches and nothing else does is a Continue that renders,
       enables, and goes nowhere: proportion-01 shipped one, and it stopped
       that unit at 4 screens of 49 with every screen looking correct. -->
  <button id="walk-btn" onclick="walkPart()" title="בדיקת מעבר: לוחץ על 'המשך' לאורך כל החלק">🚶</button>
  <button class="st-btn" id="st-clear" onclick="setStatus(null)"    title="איפוס סטטוס">↺</button>
  <span style="margin-right:auto; font-size:11px; font-weight:400;">Ctrl+← קדימה &nbsp;|&nbsp; Ctrl+→ אחורה</span>
</div>

<!-- ?cb= is not cosmetic. Without it the browser serves the lomda from
     its cache and a review is done against a BUILD THAT NO LONGER EXISTS —
     three review notes in a row were re-raised on screens that had already
     been fixed, because the harness kept handing back the old page. The
     value is fixed per LOAD of the harness, so a reload gets fresh files
     while navigating inside the part does not thrash the cache. -->
<iframe id="lomda-frame"></iframe>
<script>
  document.getElementById('lomda-frame').src = 'index.html?cb=' + Date.now();
</script>

<div id="notes-drawer">
  <div id="notes-head">
    <span id="notes-screen">S0</span>
    <span id="notes-name"></span>
    <button id="notes-close" onclick="notesToggle(false)" title="סגירה">×</button>
  </div>
  <textarea id="notes-text" placeholder="תיקונים והערות למסך הזה…"></textarea>
  <div id="notes-summary"></div>
  <div id="notes-foot">
    <button id="notes-save" onclick="notesSummary()">סיכום כל התיקונים</button>
    <button onclick="notesCopy()">העתקה</button>
    <button onclick="notesBack()">חזרה למסך</button>
    <button id="notes-gen" onclick="notesToggleGeneral()" title="הערות שאינן שייכות למסך מסוים">הערה כללית</button>
    <button id="notes-del" class="is-danger" onclick="notesClearScreen()">מחיקת ההערה</button>
    <button id="notes-clear" class="is-danger" onclick="notesClearAll()">מחיקת הכול</button>
    <span id="notes-status"></span>
  </div>
</div>


<script>
  const UNIT_ID = 'methodica-math-proportion-02-04';
  let cur = 0;
  let total = 1;
  /* Filled from the lomda's own DEV_READY — never duplicated here, or the
     two drift the moment a screen lands. */
  let RESERVED = {};
  /* screen -> how many steps it has. From the lomda's own DEV_READY, never
     a second copy here — a duplicated step count drifts the moment a step
     is added. */
  let STEPS_PER = {};
  let curStep = 1;

  const frame  = document.getElementById('lomda-frame');
  /* where this part sits in the unit — see check_screen_map.py, which holds
     the parts and the harnesses together */
  const UNIT_OFFSET = 27, UNIT_TOTAL = 60;
  const label  = document.getElementById('dev-label');
  const input  = document.getElementById('jump-input');
  const select = document.getElementById('screen-select');

  /* Named screens — extend as screens are added, in spec order.
     Empty until the production script is converted to spec/; the select
     then falls back to bare indices, which is correct-but-terse rather
     than wrong. */
  /* Named screens, in spec order. The index is the data-screen value, so a
     RESERVED index keeps its slot here — the list must stay the same length
     as TOTAL_SCREENS in main.js or the select and the lomda disagree about
     what screen 8 is. check_screen_map.py holds the two to each other. */
  const SCREEN_NAMES = [
    'מעבר: זמן טוב ללמוד גם בצורה אחרת (שקף 51)',
    'משימת כיתה: כמה מ"מ בס"מ אחד? (שקף 52)',
    'משימת כיתה: היחס ס"מ : מ"מ (שקף 53)',
    'הכרת הסרגל: 450 מ"מ לסנטימטרים (שקף 54)',
    'האינצ׳ים בסרגל: 5 אינצ׳ים בס"מ (שקף 55)',
    'השלמת הפרופורציה אינץ׳ / ס"מ (שקף 56)',
    'איפה נפגוש אינצ׳ים? — סיכום (שקף 57)',
    'מדידת אלכסון המסך שלכם (שקף 58)',
  ];

  function rebuildSelect() {
    select.innerHTML = '';
    const n = SCREEN_NAMES.length || total;
    for (let i = 0; i < n; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = i + (SCREEN_NAMES[i] ? ' — ' + SCREEN_NAMES[i] : '');
      select.appendChild(opt);
    }
    markReserved();
  }
  rebuildSelect();

  window.addEventListener('message', e => {
    if (e.data?.type === 'DEV_READY') {
      total = e.data.total;
      RESERVED = e.data.reserved || {};
      STEPS_PER = e.data.stepsPerScreen || {};
      /* The count arrives after the first rebuild, so redo the select once
         it is known — otherwise it stays stuck at the placeholder total. */
      rebuildSelect();
      updateLabel();
    }
    if (e.data?.type === 'DEV_SCREEN') {
      cur = e.data.screen;
      curStep = e.data.step || 1;
      renderStepControl(e.data.steps || 1);
      if (document.getElementById('notes-drawer').classList.contains('open')) notesLoad();
      input.value = cur;
      if ([...select.options].some(o => Number(o.value) === cur)) select.value = cur;
      updateLabel();
    }
  });

  function send(n) {
    frame.contentWindow.postMessage({ type: 'DEV_GOTO', screen: n }, '*');
    cur = n;
    input.value = n;
    select.value = n;
    updateLabel();
    if (document.getElementById('notes-drawer').classList.contains('open')) notesLoad();
    /* No optimistic correction here: the lomda answers with DEV_SCREEN
       carrying the screen it ACTUALLY landed on, which for a reserved index
       is the nearest built one. Letting it snap back is the point. */
  }

  /* The lomda owns the step, so this only asks. It answers with DEV_SCREEN,
     which redraws the control from what actually happened — the same
     "no optimistic correction" rule send() follows for screens. */
  function stepBy(delta) {
    frame.contentWindow.postMessage(
      { type: 'DEV_STEP', step: curStep + delta }, '*');
  }

  function renderStepControl(steps) {
    const g = document.getElementById('step-group');
    const l = document.getElementById('step-label');
    const n = steps || STEPS_PER[cur] || 1;
    g.hidden = n <= 1;
    l.textContent = 'שלב ' + curStep + ' / ' + n;
  }

  /* ── Walk-through check ─────────────────────────────────────
     Drives the lomda through the iframe by clicking its own visible pill,
     answering anything that gates it, and recording where it lands. State
     is read from the DOM (`.screen.active`, `data-step`) rather than from
     the lomda's variables: a `let` at the top level of a classic script
     lives in script scope and never reaches `window`, and the DOM is what
     the learner actually sees anyway. */
  function walkPart() {
    const w = frame.contentWindow, d = frame.contentDocument;
    const scr  = () => Number(d.querySelector('.screen.active')?.dataset.screen);
    const step = () => Number(d.querySelector('.screen.active')?.dataset.step || 0);
    const path = [];

    const card = d.querySelector('#s0 .option-card');
    if (card) card.click();

    let guard = 0, verdict = '';
    while (guard++ < 200) {
      const s0 = scr(), k0 = step();
      path.push('S' + s0 + (k0 ? '.' + k0 : ''));

      const shown = [...d.querySelectorAll('.btn-continue')]
        .find(b => b.offsetParent !== null);
      if (shown && shown.disabled) {
        const sub = shown.id.match(/^s(\d+)-submit$/);
        if (sub && w.Q && w.Q.spec(Number(sub[1])) && w.devResolveQuestion) {
          w.devResolveQuestion(Number(sub[1]), 'correct');
        } else {
          const opt = d.querySelector('.screen.active .gp-pick-opt');
          if (opt) opt.click();
        }
      }
      const pill = [...d.querySelectorAll('.btn-continue')]
        .find(b => b.offsetParent !== null && !b.disabled);
      if (!pill) { verdict = '⛔ נתקע: אין כפתור המשך פעיל ב-S' + s0; break; }
      /* A click on the LAST screen's pill crosses a part boundary: the
         frame navigates, so the screen looks unchanged for a moment. That
         is a successful exit, not a stall — reporting it as "stuck" is how
         a passing walk reads as a failure. */
      const lastOfPart = !d.querySelector('.screen.active')?.nextElementSibling?.classList?.contains('screen');
      pill.click();
      if (scr() === s0 && step() === k0) {
        if (lastOfPart) { verdict = '✔ עבר לחלק הבא מ-S' + s0; break; }
        verdict = '⛔ נתקע: לחיצה על המשך ב-S' + s0 + (k0 ? '.' + k0 : '') + ' לא הזיזה כלום';
        break;
      }
      if (scr() === undefined) { verdict = '✔ יצא מהחלק (מעבר לחלק הבא)'; break; }
    }
    if (!verdict) verdict = '⛔ נתקע: יותר מ-200 צעדים';
    console.log('[walk] ' + path.join(' → '));
    alert(verdict + '\n\n' + path.join(' → '));
    send(0);
  }

  function nav(delta) {
    const next = Math.max(0, Math.min(total - 1, cur + delta));
    send(next);
  }

  function jumpTo() {
    const n = parseInt(input.value, 10);
    if (!isNaN(n) && n >= 0 && n < total) send(n);
  }

  function isReserved(n) {
    return Object.prototype.hasOwnProperty.call(RESERVED, String(n));
  }

  /* Bakes "not built" into each option's BASE text, so renderStatus() can
     keep prefixing the review glyph without erasing it. */
  function markReserved() {
    [...select.options].forEach(o => {
      const n = Number(o.value);
      if (!isReserved(n)) return;
      const base = o.dataset.base || o.textContent;
      o.dataset.base = base.indexOf('⛔') === -1 ? base + '  ⛔ טרם נבנה' : base;
      o.textContent = o.dataset.base;
      o.title = RESERVED[n];
    });
    renderStatus();
  }

  function updateLabel() {
    /* 06.09: name the screen the way the whole unit does — the producer says
       "dev slide 43", and a per-part counter cannot be quoted. The part and its
       own index follow as the detail. */
    label.textContent = 'S ' + (UNIT_OFFSET + cur + 1) + ' / ' + UNIT_TOTAL +
                        '   (חלק 04 · S' + cur + ' / ' + (total - 1) + ')';
    label.classList.toggle('reserved', isReserved(cur));
    label.title = isReserved(cur) ? 'שמור, טרם נבנה — ' + RESERVED[cur] : '';
    renderStatus();
  }

  /* ── review status (producer workflow): green = approved, yellow =
     needs fixing. Persisted per unit in localStorage. ── */
  const REVIEW_KEY = 'dev_review_' + UNIT_ID;
  function loadReview() {
    try { return JSON.parse(localStorage.getItem(REVIEW_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveReview(r) {
    try { localStorage.setItem(REVIEW_KEY, JSON.stringify(r)); } catch (e) {}
  }
  function setStatus(st) {
    const r = loadReview();
    if (st) r[cur] = st; else delete r[cur];
    saveReview(r);
    renderStatus();
  }
  function renderStatus() {
    const r = loadReview();
    const bar = document.getElementById('dev-bar');
    bar.classList.toggle('st-ok',  r[cur] === 'ok');
    bar.classList.toggle('st-fix', r[cur] === 'fix');
    bar.classList.toggle('st-reserved', isReserved(cur) && !r[cur]);
    const badge = document.getElementById('st-badge');
    badge.textContent = r[cur] === 'ok'  ? 'מאושר ✓'
                      : r[cur] === 'fix' ? 'לתיקון !'
                      : isReserved(cur)  ? 'טרם נבנה'
                      : '—';
    [...select.options].forEach(o => {
      const n = Number(o.value);
      const base = o.dataset.base || o.textContent;
      o.dataset.base = base;
      o.textContent = (r[n] === 'ok' ? '✓ ' : r[n] === 'fix' ? '⚠ ' : '') + base;
    });
  }


  /* ── Review notes ─────────────────────────────────────────
     One note per screen, saved as you type under dev_notes_<UNIT_ID>.
     Deliberately in the DEV harness and not in the lomda: it is a proofing
     tool for the producer, and nothing in the deliverable may depend on it. */
  const NOTES_KEY = 'dev_notes_' + UNIT_ID;
  function notesAll() {
    try { return JSON.parse(localStorage.getItem(NOTES_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function notesWrite(o) {
    try {
      if (Object.keys(o).length) localStorage.setItem(NOTES_KEY, JSON.stringify(o));
      else localStorage.removeItem(NOTES_KEY);   // no empty husks left behind
    } catch (e) {}
  }
  /* Which note the drawer is editing.

     A multi-step screen needs a key PER STEP. The carousel is one screen
     with twelve slides behind it, and keying its notes by screen alone put
     every one of them in the same slot: a reviewer stepping through and
     writing a correction on step 7 overwrote the one from step 3, and the
     summary showed a single "S5" entry for a whole deck sequence.

     'general' is the bucket for anything that is not about one screen.
     Screen keys stay plain numbers when the screen has no steps, so notes
     written before this change still load. */
  let notesGeneral = false;

  function notesKey() {
    if (notesGeneral) return 'general';
    const steps = STEPS_PER[cur] || 1;
    return steps > 1 ? cur + '.' + curStep : String(cur);
  }

  /* Sortable position for a key: general first, then screen, then step. A
     plain "5" written before per-step keys existed sorts ahead of "5.1" and
     is labelled as covering the whole screen. */
  function notesOrder(k) {
    if (k === 'general') return [-1, 0];
    const p = String(k).split('.');
    return [Number(p[0]), p.length > 1 ? Number(p[1]) : 0];
  }

  function notesLabel(k) {
    if (k === 'general') return 'כללי';
    const p = String(k).split('.');
    return p.length > 1 ? 'S' + p[0] + ' · שלב ' + p[1] : 'S' + p[0];
  }

  function notesName(k) {
    if (k === 'general') return 'הערות שאינן שייכות למסך מסוים';
    const n = Number(String(k).split('.')[0]);
    const steps = STEPS_PER[n] || 1;
    const whole = steps > 1 && String(k).indexOf('.') === -1
      ? '  (כל השלבים)' : '';
    return (SCREEN_NAMES[n] || '') + whole;
  }

  function notesToggle(force) {
    const d = document.getElementById('notes-drawer');
    const open = force === undefined ? !d.classList.contains('open') : force;
    d.classList.toggle('open', open);
    if (open) { notesBack(); notesLoad(); document.getElementById('notes-text').focus(); }
    else notesSave();       // closing must not lose what is in the box
  }
  function notesLoad() {
    const k = notesKey();
    document.getElementById('notes-screen').textContent = notesLabel(k);
    document.getElementById('notes-name').textContent = notesName(k);
    document.getElementById('notes-text').value = notesAll()[k] || '';
    document.getElementById('notes-text').placeholder = notesGeneral
      ? 'הערות כלליות ליחידה — לא למסך מסוים…'
      : 'תיקונים והערות ל' + notesLabel(k) + '…';
    document.getElementById('notes-gen').classList.toggle('is-on', notesGeneral);
    notesFlag();
  }
  function notesSave() {
    const all = notesAll(), k = notesKey();
    const v = document.getElementById('notes-text').value;
    if (v.trim()) all[k] = v; else delete all[k];
    notesWrite(all);
    notesSay('נשמר');
    notesFlag();
  }
  /* Switch between "this screen/step" and the general bucket. Saves what is
     in the box first — the reviewer's half-typed note must not vanish
     because they reached for a different tab. */
  function notesToggleGeneral() {
    notesSave();
    notesGeneral = !notesGeneral;
    notesBack();
    notesLoad();
    document.getElementById('notes-text').focus();
  }
  /* A dot on the button whenever ANY screen carries a note, so a reviewer
     can see at a glance that the file is not empty. */
  function notesFlag() {
    const any = Object.keys(notesAll()).length > 0;
    document.getElementById('notes-btn').classList.toggle('has-notes', any);
  }
  function notesBack() {
    document.getElementById('notes-drawer').classList.remove('summary');
  }
  function notesBlocks() {
    const all = notesAll();
    return Object.keys(all)
      .sort(function (a, b) {
        const x = notesOrder(a), y = notesOrder(b);
        return x[0] - y[0] || x[1] - y[1];
      })
      .map(function (k) {
        const nm = notesName(k);
        return { n: k, text: notesLabel(k) + (nm ? '  — ' + nm : '') +
                             '\n' + all[k].trim() + '\n' };
      });
  }
  function notesSummary() {
    const blocks = notesBlocks();
    const box = document.getElementById('notes-summary');
    box.textContent = '';
    if (!blocks.length) {
      box.textContent = '(אין תיקונים עדיין)';
    } else {
      blocks.forEach(function (b) {
        const row = document.createElement('div');
        row.className = 'nsum-item';
        const del = document.createElement('button');
        del.className = 'nsum-del';
        del.type = 'button';
        del.textContent = '✕';
        del.title = 'מחיקת התיקון הזה';
        del.onclick = function () { notesDelete(b.n); };
        const body = document.createElement('div');
        body.className = 'nsum-body';
        /* textContent, never innerHTML: this is text the reviewer typed. */
        body.textContent = b.text;
        row.appendChild(del);
        row.appendChild(body);
        box.appendChild(row);
      });
    }
    /* The copy button must hand over the notes and NOT the ✕ glyphs the
       buttons put in the DOM, so the plain text is kept alongside the
       rendered version rather than scraped back off it. */
    box.dataset.plain = blocks.length
      ? blocks.map(function (b) { return b.text; }).join('\n')
      : '(אין תיקונים עדיין)';
    document.getElementById('notes-drawer').classList.add('summary');
  }

  /* ── Clearing ─────────────────────────────────────────────
     Notes are a review record and nothing else holds a copy, so both of
     these confirm first. Deleting the entry the reviewer is standing on
     also clears the textarea, or the next keystroke would write it back. */
  function notesDropKey(k) {
    const all = notesAll();
    delete all[k];
    notesWrite(all);
    // Clear the box only when it is the entry currently open in it.
    if (String(k) === notesKey()) document.getElementById('notes-text').value = '';
  }
  function notesDelete(k) {
    if (!confirm('למחוק את התיקון של ' + notesLabel(k) + '?')) return;
    notesDropKey(k);
    notesSummary();
    notesFlag();
    notesSay('נמחק');
  }
  function notesClearScreen() {
    if (!document.getElementById('notes-text').value.trim()) { notesSay('אין מה למחוק'); return; }
    if (!confirm('למחוק את התיקון של ' + notesLabel(notesKey()) + '?')) return;
    notesDropKey(notesKey());
    notesFlag();
    notesSay('נמחק');
  }
  function notesClearAll() {
    const blocks = notesBlocks();
    if (!blocks.length) { notesSay('אין מה למחוק'); return; }
    if (!confirm('למחוק את כל ' + blocks.length + ' התיקונים? אין ביטול.')) return;
    try { localStorage.removeItem(NOTES_KEY); } catch (e) {}
    document.getElementById('notes-text').value = '';
    notesSummary();
    notesFlag();
    notesSay('הכול נמחק');
  }
  function notesSay(msg) {
    const s = document.getElementById('notes-status');
    s.textContent = msg;
    clearTimeout(notesSay._t);
    notesSay._t = setTimeout(function () { s.textContent = ''; }, 1400);
  }

  function notesCopy() {
    const d = document.getElementById('notes-drawer');
    const text = d.classList.contains('summary')
      ? (document.getElementById('notes-summary').dataset.plain || '')
      : notesLabel(notesKey()) + '\n' + document.getElementById('notes-text').value;
    navigator.clipboard.writeText(text).then(function () { notesSay('הועתק'); });
  }
  document.getElementById('notes-text').addEventListener('input', notesSave);
  /* Typing in the drawer must not reach the harness's Ctrl+arrow nav. */
  document.getElementById('notes-drawer').addEventListener('keydown', function (e) {
    e.stopPropagation();
  });
  notesFlag();

  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'ArrowLeft')  nav(+1);
    if (e.ctrlKey && e.key === 'ArrowRight') nav(-1);
  });
  renderStatus();
</script>
</body>
</html>
