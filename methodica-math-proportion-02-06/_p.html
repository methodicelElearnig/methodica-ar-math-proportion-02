<!doctype html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" src="index.html" style="width:1280px;height:710px;border:0"></iframe><pre id="out" style="font:11px monospace">…</pre>
<script>
f.onload=()=>{const w=f.contentWindow,d=f.contentDocument,t=ms=>new Promise(r=>setTimeout(r,ms));
 (async()=>{const rows=[];await t(800);
  for(const n of [46,47,48,49,50]){
   w.goTo(n);await t(450);
   const sec=d.querySelector('[data-screen="'+n+'"]');
   const F=s=>{const e=sec.querySelector(s);return e?getComputedStyle(e).fontSize:'-';};
   const board=sec.querySelector('.camp-board');
   rows.push(n+' stem='+F('.quiz-stem')+' cb-title='+F('.cb-title')+' cb-h4='+F('.cb-group h4')+' cb-p='+F('.cb-group p')
     +' boardW='+(board?Math.round(board.getBoundingClientRect().width):'-')
     +' boardH='+(board?Math.round(board.getBoundingClientRect().height):'-')
     +' colH='+Math.round(sec.querySelector('.quiz-content').getBoundingClientRect().height)
     +' stepper='+!!sec.querySelector('.qstepper'));
   // feedback
   for(let k=0;k<2;k++){ sec.querySelectorAll('input').forEach(i=>{i.value='1';i.dispatchEvent(new w.Event('input',{bubbles:true}));});
     const o=sec.querySelector('.scq-opt'); if(o) o.click(); await t(110); try{w.quizCheck(n);}catch(e){} await t(620);}
   await t(350);
   const b=d.querySelector('#q'+n+'-feedbox .fb-body');
   rows.push('   fb fs='+(b?getComputedStyle(b.querySelector('p')||b).fontSize:'-')
     +' scrollH='+(b?b.scrollHeight:'-')+' clientH='+(b?b.clientHeight:'-'));
  }
  document.getElementById('out').textContent=rows.join('\n');
 })();};
</script>
