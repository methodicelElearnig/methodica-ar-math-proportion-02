<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>משימת ריצוף במיינקרפט - פרופורציה</title>
    <link rel="stylesheet" href="../../unit-assets/fonts/fonts.css">
    <style>
        /* 06.10, producer: "text in the app is small make it bigger. also make
           the squares of the דשא ושיש more readable.. find a way."
           Three changes, in order of how much they buy:
             1. Hebrew is set in Assistant, not 'Courier New'. A monospace stack
                has no Hebrew, so every Hebrew glyph here was falling back to a
                thin system face at a monospace's small x-height. That alone was
                most of the "small".
             2. One step up on every size, and the tiles grow 46 -> 58px so the
                label has room to be read rather than guessed.
             3. The two tiles are now told apart by THREE signals, not one:
                colour (green/brown turf vs grey stone), a texture, and a
                high-contrast label — white on the turf's dark soil band, near
                black on the stone. The old marble was near-white with a mid-grey
                label, which is the pairing that failed. */
        :root { --turf-top:#6FBF3B; --turf-soil:#6B4A2F; --stone:#C9CCD2; }

        body {
            font-family: 'Assistant', 'Arial Hebrew', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 14px 16px 20px;
            margin: 0;
            font-size: 20px;
            user-select: none;
        }
        .container {
            max-width: 760px;
            margin: 0 auto;
            background-color: #2b2b2b;
            padding: 18px 20px 22px;
            border-radius: 4px;
            border: 4px solid #111;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        h1 {
            color: #7CFF6B;
            font-size: 30px;
            margin: 0 0 10px;
            text-shadow: 2px 2px 0px #000;
        }
        .container > p { font-size: 20px; line-height: 1.45; margin: 0 0 4px; }
        .controls {
            display: flex;
            justify-content: space-around;
            margin: 16px 0;
            background: #363636;
            padding: 12px;
            border: 3px solid #1c1c1c;
        }
        .tile-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .tile-group h3 { font-size: 22px; margin: 0 0 6px; }
        .tile-group p { font-size: 20px; margin: 6px 0 0; }
        .tile-group p span { font-weight: 700; font-size: 22px; }

        button {
            font-family: inherit;
            font-size: 30px;
            line-height: 1;
            width: 56px;
            height: 56px;
            margin: 4px;
            cursor: pointer;
            border-top: 4px solid rgba(255,255,255,0.4);
            border-left: 4px solid rgba(255,255,255,0.4);
            border-bottom: 4px solid rgba(0,0,0,0.6);
            border-right: 4px solid rgba(0,0,0,0.6);
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            box-shadow: 2px 3px 0px #000;
        }
        button:active {
            border-top: 4px solid rgba(0,0,0,0.6);
            border-left: 4px solid rgba(0,0,0,0.6);
            border-bottom: 4px solid rgba(255,255,255,0.4);
            border-right: 4px solid rgba(255,255,255,0.4);
            transform: translate(2px, 2px);
            box-shadow: none;
        }
        .btn-plus { background-color: #489b38; }
        .btn-minus { background-color: #b8352b; }

        /* הגריד הראשי מסדר את ה"קומות" אחת מתחת לשנייה */
        .grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-height: 120px;
            background: #141414;
            padding: 16px;
            border: 3px solid #080808;
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.9);
            margin-top: 14px;
        }

        /* כל קומה היא קבוצה של 2 שיש ו-5 דשא */
        .ratio-row {
            display: flex;
            gap: 8px;
            background: #222;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }

        .block {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 5px;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: .5px;
            position: relative;
            box-sizing: border-box;
            box-shadow:
                inset 3px 3px 0px rgba(255, 255, 255, 0.28),
                inset -3px -3px 0px rgba(0, 0, 0, 0.35),
                2px 3px 4px rgba(0,0,0,0.5);
        }

        /* דשא — turf band over soil. The label rides the DARK soil band, which
           is what makes white text readable on a bright green tile. */
        .grass {
            background:
                repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 4px, transparent 4px 12px),
                linear-gradient(180deg, var(--turf-top) 0 38%, #4E8C27 38% 46%, var(--turf-soil) 46%);
            border: 3px solid #241806;
            color: #ffffff;
            text-shadow: 0 1px 0 #000, 0 0 3px rgba(0,0,0,.9);
        }

        /* שיש — a real stone grey, not near-white, so the near-black label has
           something to sit on and the tile reads as a different MATERIAL. */
        .lapis {
            background:
                repeating-linear-gradient(135deg, rgba(255,255,255,.35) 0 3px, transparent 3px 11px),
                repeating-linear-gradient(45deg, rgba(90,96,108,.30) 0 2px, transparent 2px 9px),
                linear-gradient(180deg, #DDE0E5 0%, var(--stone) 55%, #AEB3BC 100%);
            border: 3px solid #5E646E;
            color: #15181D;
            text-shadow: 0 1px 0 rgba(255,255,255,.85);
        }

        .status {
            margin-top: 14px;
            font-size: 21px;
            line-height: 1.35;
            padding: 12px;
            background: #3a3a3a;
            border: 2px solid #111;
            font-weight: 700;
        }
        .success {
            background-color: #2b702f;
            color: #8BFF8E;
            border-color: #6cff70;
            text-shadow: 1px 1px 0 #000;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>משימת ריצוף: יחס 2:5</h1>
    <p>עליכם להגיע ל-<strong>30 בלוקים של דשא</strong> ולשמור על פרופורציה של <strong>2 בלוקים של שיש לכל 5 בלוקים של דשא</strong>.</p>

    <div class="controls">
        <div class="tile-group">
            <h3>בלוק דשא</h3>
            <div>
                <button class="btn-plus" onclick="changeTile('grass', 1)">+</button>
                <button class="btn-minus" onclick="changeTile('grass', -1)">-</button>
            </div>
            <p>כמות: <span id="grassCount">5</span></p>
        </div>

        <div class="tile-group">
            <h3>בלוק שיש</h3>
            <div>
                <button class="btn-plus" onclick="changeTile('lapis', 1)">+</button>
                <button class="btn-minus" onclick="changeTile('lapis', -1)">-</button>
            </div>
            <p>כמות: <span id="lapisCount">2</span></p>
        </div>
    </div>

    <div id="statusMessage" class="status">היחס בין בלוקי השיש לבלוקי הדשא הוא 2:5</div>

    <div class="grid" id="gridContainer"></div>
</div>

<script>
    let grass = 5;
    let lapis = 2;

    function render() {
        document.getElementById('grassCount').innerText = grass;
        document.getElementById('lapisCount').innerText = lapis;

        const grid = document.getElementById('gridContainer');
        grid.innerHTML = '';

        let remGrass = grass;
        let remLapis = lapis;

        // לולאה שמייצרת קומות של (2 שיש + 5 דשא) עד שנגמרים הבלוקים
        while (remGrass > 0 || remLapis > 0) {
            let rowDiv = document.createElement('div');
            rowDiv.className = 'ratio-row';

            // קודם דוחפים לשורה עד 2 שיש
            let bCount = Math.min(2, remLapis);
            for(let i = 0; i < bCount; i++) {
                let div = document.createElement('div');
                div.className = 'block lapis';
                div.innerText = 'שיש';
                rowDiv.appendChild(div);
            }
            remLapis -= bCount;

            // ואז דוחפים לאותה שורה עד 5 דשא
            let gCount = Math.min(5, remGrass);
            for(let i = 0; i < gCount; i++) {
                let div = document.createElement('div');
                div.className = 'block grass';
                div.innerText = 'דשא';
                rowDiv.appendChild(div);
            }
            remGrass -= gCount;

            grid.appendChild(rowDiv);
        }

        checkProportion();
    }

    function changeTile(type, amount) {
        if (type === 'grass' && grass + amount >= 0) grass += amount;
        if (type === 'lapis' && lapis + amount >= 0) lapis += amount;
        render();
    }

    function checkProportion() {
        const msg = document.getElementById('statusMessage');
        msg.className = 'status';

        if (grass === 0 && lapis === 0) {
            msg.innerText = "הלוח ריק";
            return;
        }

        if (grass === 30 && lapis === 12) {
            msg.innerText = "⭐ כל הכבוד! פיצחתם את המשימה: היחס בין בלוקי השיש לבלוקי הדשא הוא 12:30 (בדיוק 2:5)!";
            msg.classList.add('success');
        } else {
            msg.innerText = `היחס בין בלוקי השיש לבלוקי הדשא הוא ${lapis}:${grass}`;
        }
    }

    render();
</script>

</body>
</html>
