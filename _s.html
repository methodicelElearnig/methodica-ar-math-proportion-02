<!doctype html><meta charset="utf-8"><body style="margin:0"><iframe id="f" style="width:1280px;height:710px;border:0"></iframe>
<script>
const f=document.getElementById('f'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const P=new URLSearchParams(location.search);
f.src='index.html?b='+Date.now();
f.onload=async()=>{const w=f.contentWindow;await sleep(1600);
 w.postMessage({type:'DEV_GOTO',screen:+P.get('s')},'*');await sleep(1400);};
</script>
